        <!--Enllaç amb el full d'estil / css-->

        <link rel="icon" type="image/png" href="./imatges/favicon.ico">
        <!-- Font Awesome CDN per a les Icones -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
    <!--Les parts de l'explicació de l'estructura estan a l'índex-->

        <i id="notamusical" class="fa-solid fa-music"></i> 
        <header>
            <nav> 
                <input type="checkbox" id="menu-toggle">
                <label class="hamburguesa" for="menu-toggle" id="botoMenu"> <i class="fa-solid fa-bars"></i> </label>

                    <li><a href="galeria.html" class="canvipg">Galeria</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section>
                <!--Títol a mida del H1-->
                <h1>Registra't</h1>
            </section>
            <!--Formulari de registre on cada input té el seu propi div per poder separar els contenidors-->
            <div class="container">
            <form>
                <div>
                    <input type="text" id="nom" name="nom" placeholder="Nom..." maxlength="20" required>
                </div>
                <div>
                    <!--Utilitzem 'oninput' per comprovar al js si l'email es vàlid i si la contrasenya i la validació són iguals a temps real-->
                    <input type="email" id="email" name="email" placeholder="Correu electrònic..." oninput="validarCorreu()" maxlength="40" required>
                </div>
                <div>
                    <input type="password" id="contrasenya" name="contrasenya" placeholder="Contrasenya..." maxlength="20" required>
                </div>
                <div>
                    <input type="password" id="confirmarContrasenya" name="confirmar contrasenya" placeholder="Confirmar contrasenya..."  oninput="validarContrasenya()"  maxlength="20" required>
                </div>
                <!--Botó per fer el registre-->
                <section id="botoContacte" >
                <button>Registrar-se</button>
                </section>
            </form>
            </div>
        </main>
